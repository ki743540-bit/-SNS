<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DULL-NET // 16-COLOR BBS</title>
  <style>
    /* -------------------------------------------------------------
       16-COLOR PALETTE DEFINITIONS & THEMES
       ------------------------------------------------------------- */
    :root {
      --pal-0:  #101216; /* 暗黒スレート */
      --pal-1:  #1a1e24; /* パネル背景 */
      --pal-2:  #252b34; /* 入力・ボタン */
      --pal-3:  #38414e; /* 境界線 */
      --pal-4:  #536074; /* 明境界線 */
      --pal-5:  #778599; /* 減衰テキスト */
      --pal-6:  #a9b5c5; /* 標準テキスト */
      --pal-7:  #e0e6ed; /* ハイライト白 */
      --pal-8:  #964848; /* 煉瓦赤 */
      --pal-9:  #c26363; /* サーモン */
      --pal-10: #a17846; /* 黄土 */
      --pal-11: #c99b5b; /* くすみ黄 */
      --pal-12: #4f7356; /* 深緑 */
      --pal-13: #75a37d; /* 薄緑 */
      --pal-14: #43698c; /* 藍色 */
      --pal-15: #6d96bd; /* 水色 */

      --bg: var(--pal-0);
      --surface: var(--pal-1);
      --surface-sub: var(--pal-2);
      --border: var(--pal-3);
      --border-light: var(--pal-4);
      --text-dim: var(--pal-5);
      --text: var(--pal-6);
      --text-bright: var(--pal-7);
      --accent: var(--pal-11);
      --link: var(--pal-15);

      --font-mono: -apple-system, BlinkMacSystemFont, "Consolas", "Courier New", "Hiragino Kaku Gothic ProN", "MS Gothic", monospace;
    }

    /* テーマ切り替え用クラス */
    body.theme-mono {
      --bg: #000000;
      --surface: #0e0e0e;
      --surface-sub: #1c1c1c;
      --border: #444444;
      --border-light: #777777;
      --text-dim: #888888;
      --text: #cccccc;
      --text-bright: #ffffff;
      --accent: #ffffff;
      --link: #ffffff;
    }

    body.theme-amber {
      --bg: #140d02;
      --surface: #211604;
      --surface-sub: #332207;
      --border: #63410e;
      --border-light: #946115;
      --text-dim: #a67323;
      --text: #ffb833;
      --text-bright: #ffda73;
      --accent: #ffb833;
      --link: #ffa600;
    }

    body.theme-pc98 {
      --bg: #0c1613;
      --surface: #14241f;
      --surface-sub: #1e362e;
      --border: #2e5244;
      --border-light: #49806a;
      --text-dim: #67a68c;
      --text: #a8d5be;
      --text-bright: #d8f5e7;
      --accent: #6cd1a4;
      --link: #5ec799;
    }

    body.theme-gb {
      --bg: #1e2914;
      --surface: #2b3b1c;
      --surface-sub: #3b4f26;
      --border: #526e35;
      --border-light: #729949;
      --text-dim: #729949;
      --text: #96ba66;
      --text-bright: #badc83;
      --accent: #badc83;
      --link: #96ba66;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* -------------------------------------------------------------
       HEADER & THEME SELECTOR
       ------------------------------------------------------------- */
    header {
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo-text {
      font-size: 13px;
      font-weight: bold;
      color: var(--text-bright);
      letter-spacing: 0.5px;
    }
    
    /* 配色バー（ワンタップで即変更可能） */
    .theme-bar {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .theme-btn {
      font-size: 11px;
      padding: 4px 8px;
      background: var(--surface-sub);
      border: 1px solid var(--border);
      color: var(--text-dim);
      white-space: nowrap;
      cursor: pointer;
      border-radius: 2px;
    }
    .theme-btn.active {
      border-color: var(--accent);
      color: var(--text-bright);
      background: var(--border);
      font-weight: bold;
    }

    /* -------------------------------------------------------------
       CATEGORY SELECTOR BAR (スマホ最適化)
       ------------------------------------------------------------- */
    .category-scroll-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 6px 8px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }
    .cat-tab {
      font-size: 12px;
      padding: 5px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      border-radius: 2px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .cat-tab.active {
      border-color: var(--accent);
      color: var(--text-bright);
      background: var(--surface-sub);
      font-weight: bold;
    }
    .cat-count {
      font-size: 10px;
      background: var(--border);
      color: var(--text-dim);
      padding: 0 4px;
      border-radius: 6px;
    }

    /* -------------------------------------------------------------
       ROOM BANNER
       ------------------------------------------------------------- */
    .room-info-bar {
      background: var(--surface-sub);
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* -------------------------------------------------------------
       POST FEED
       ------------------------------------------------------------- */
    .feed-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 200px;
    }
    .empty-msg {
      text-align: center;
      color: var(--text-dim);
      padding: 30px 10px;
      border: 1px dashed var(--border);
      margin: 10px 0;
    }

    .post-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border-light);
      padding: 8px 10px;
    }
    .post-card.highlight {
      border-color: var(--accent);
      background: var(--surface-sub);
    }
    .post-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 4px;
      padding-bottom: 3px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .post-num {
      color: var(--accent);
      font-weight: bold;
      cursor: pointer;
    }
    .post-author {
      color: var(--text-bright);
      font-weight: bold;
      margin: 0 4px;
    }
    .post-body {
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }
    .res-anchor {
      color: var(--link);
      font-weight: bold;
      cursor: pointer;
      text-decoration: underline;
    }

    /* スタンプ描画表示 */
    .post-stamp {
      margin-top: 6px;
      display: inline-grid;
      grid-template-columns: repeat(8, 6px);
      grid-template-rows: repeat(8, 6px);
      gap: 1px;
      background: var(--bg);
      padding: 2px;
      border: 1px solid var(--border);
    }
    .post-stamp-dot {
      width: 6px;
      height: 6px;
    }

    .post-footer {
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .react-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 11px;
      padding: 2px 6px;
      cursor: pointer;
    }

    /* -------------------------------------------------------------
       COMPOSE PANEL (スタンプ & 入力フォーム)
       ------------------------------------------------------------- */
    .compose-panel {
      background: var(--surface);
      border-top: 2px solid var(--border);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* スタンプ作成トグルエリア */
    .stamp-accordion-header {
      font-size: 11px;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
      background: var(--surface-sub);
      border: 1px solid var(--border);
    }
    .stamp-editor-wrapper {
      display: none;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-top: none;
    }
    .stamp-editor-wrapper.open {
      display: flex;
    }

    .stamp-canvas-row {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
    }
    .stamp-grid-editor {
      display: grid;
      grid-template-columns: repeat(8, 20px);
      grid-template-rows: repeat(8, 20px);
      gap: 1px;
      background: var(--border);
      padding: 1px;
      user-select: none;
      touch-action: manipulation;
    }
    .stamp-cell-btn {
      width: 20px;
      height: 20px;
      background: var(--pal-0);
      cursor: pointer;
    }

    /* 16色スタンプパレット */
    .stamp-pal-16 {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 3px;
      max-width: 260px;
      margin: 0 auto;
    }
    .stamp-pal-dot {
      width: 24px;
      height: 20px;
      border: 1px solid #000;
      cursor: pointer;
    }
    .stamp-pal-dot.active {
      outline: 2px solid #fff;
    }

    .stamp-btn-group {
      display: flex;
      gap: 4px;
      justify-content: center;
    }
    .stamp-sub-btn {
      font-size: 10px;
      padding: 2px 6px;
      background: var(--surface-sub);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
    }

    /* 入力フィールド */
    .input-row-top {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .input-name {
      width: 110px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 5px 8px;
      font-size: 12px;
    }
    
    /* 投稿文字色選択 */
    .color-select-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-dim);
    }
    .text-dot-choice {
      width: 16px;
      height: 16px;
      border: 1px solid #000;
      cursor: pointer;
    }
    .text-dot-choice.active {
      border: 1px solid #fff;
    }

    .textarea-msg {
      width: 100%;
      height: 60px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 6px 8px;
      font-size: 13px;
      font-family: inherit;
      resize: none;
    }
    .textarea-msg:focus {
      border-color: var(--accent);
      outline: none;
    }

    .compose-action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .quick-inserts {
      display: flex;
      gap: 4px;
    }
    .quick-btn {
      background: var(--surface-sub);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 11px;
      padding: 4px 6px;
      cursor: pointer;
    }
    .send-btn {
      background: var(--accent);
      color: #000;
      border: none;
      font-weight: bold;
      padding: 6px 18px;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-top">
      <span class="logo-text">DULL-NET // 16-COLOR BBS</span>
      <button id="resetAllBtn" style="font-size:10px; background:transparent; border:none; color:var(--text-dim); cursor:pointer;">[全消去]</button>
    </div>

    <!-- 配色切り替えバー (5つのテーマ) -->
    <div class="theme-bar" id="themeBar">
      <button class="theme-btn active" data-t="dull16">DULL-16</button>
      <button class="theme-btn" data-t="mono">1-BIT MONO</button>
      <button class="theme-btn" data-t="amber">AMBER CRT</button>
      <button class="theme-btn" data-t="pc98">PC-98</button>
      <button class="theme-btn" data-t="gb">GAMEBOY</button>
    </div>
  </header>

  <!-- CATEGORY TAB BAR -->
  <div class="category-scroll-bar" id="categoryTabs">
    <!-- JSでタブを生成 -->
  </div>

  <div class="room-info-bar">
    <span id="roomInfoTitle">💬 雑談板</span>
    <span id="roomInfoCount">0 件の投稿</span>
  </div>

  <!-- FEED -->
  <main class="feed-container" id="feedContainer">
    <!-- 投稿カードがここに入ります -->
  </main>

  <!-- COMPOSE PANEL -->
  <div class="compose-panel">
    
    <!-- 8x8 スタンプ作成アコーディオン -->
    <div class="stamp-accordion-header" id="toggleStampAccordion">
      <span>🎨 8×8 スタンプを描く / 添付する</span>
      <span id="stampPreviewIndicator">[なし] ▾</span>
    </div>

    <div class="stamp-editor-wrapper" id="stampWrapper">
      <div class="stamp-canvas-row">
        <div class="stamp-grid-editor" id="stampEditorGrid"></div>
      </div>
      
      <!-- 16色スタンプ用パレット -->
      <div class="stamp-pal-16" id="stampColorPalette"></div>
      
      <div class="stamp-btn-group">
        <button class="stamp-sub-btn" id="stampClearBtn">クリア</button>
        <button class="stamp-sub-btn" id="stampGhostBtn">幽霊</button>
        <button class="stamp-sub-btn" id="stampHeartBtn">心臓</button>
        <button class="stamp-sub-btn" id="stampInvaderBtn">侵略</button>
      </div>
    </div>

    <!-- 入力フォーム -->
    <div class="input-row-top">
      <input type="text" id="nameInput" class="input-name" placeholder="名無しさん" maxlength="12">
      <div class="color-select-wrap">
        <span>色:</span>
        <div id="textColorGroup" style="display:flex; gap:3px;"></div>
      </div>
    </div>

    <textarea id="postTextInput" class="textarea-msg" placeholder="発言を入力... (>>1 で返信)"></textarea>

    <div class="compose-action-bar">
      <div class="quick-inserts">
        <button class="quick-btn" id="diceBtn">🎲 判定</button>
        <button class="quick-btn" id="kaomojiBtn">(*'ω'*)</button>
      </div>
      <button id="sendPostBtn" class="send-btn">書き込む</button>
    </div>

  </div>

  <script>
    /* =============================================================
       安全なストレージ & 通信フォールバック
       (ローカルファイル環境でのクラッシュを完全に防止)
       ============================================================= */
    const SafeStorage = {
      mem: {},
      get(k) {
        try { return localStorage.getItem(k); } catch(e) { return this.mem[k] || null; }
      },
      set(k, v) {
        try { localStorage.setItem(k, v); } catch(e) { this.mem[k] = String(v); }
      }
    };

    let safeChannel = null;
    try {
      if (typeof BroadcastChannel !== 'undefined') {
        safeChannel = new BroadcastChannel('dull_bbs_secure_channel');
      }
    } catch(e) {
      safeChannel = null; // セキュリティ制限時は安全に無効化
    }

    /* 16色定義 */
    const PAL16 = [
      '#101216', '#1a1e24', '#252b34', '#38414e',
      '#536074', '#778599', '#a9b5c5', '#e0e6ed',
      '#964848', '#c26363', '#a17846', '#c99b5b',
      '#4f7356', '#75a37d', '#43698c', '#6d96bd'
    ];

    /* 全8カテゴリ */
    const ROOMS = [
      { id: 'chat',  name: '💬 雑談' },
      { id: 'night', name: '🌙 深夜' },
      { id: 'note',  name: '📝 チラ裏' },
      { id: 'retro', name: '💾 旧式PC' },
      { id: 'pixel', name: '👾 ドット' },
      { id: 'radio', name: '📡 電波' },
      { id: 'game',  name: '🕹 遊戯' },
      { id: 'test',  name: '🧪 実験' }
    ];

    /* アプリ状態 */
    let currentRoom = 'chat';
    let posts = [];
    let stampGrid = Array(64).fill(null);
    let selectedStampColor = 7; // 白
    let selectedTextColor = 6;  // 明灰

    /* =============================================================
       DOM 要素の参照取得
       ============================================================= */
    const feedContainer = document.getElementById('feedContainer');
    const categoryTabs = document.getElementById('categoryTabs');
    const roomInfoTitle = document.getElementById('roomInfoTitle');
    const roomInfoCount = document.getElementById('roomInfoCount');
    const nameInput = document.getElementById('nameInput');
    const postTextInput = document.getElementById('postTextInput');
    const sendPostBtn = document.getElementById('sendPostBtn');
    const textColorGroup = document.getElementById('textColorGroup');

    const stampEditorGrid = document.getElementById('stampEditorGrid');
    const stampColorPalette = document.getElementById('stampColorPalette');
    const toggleStampAccordion = document.getElementById('toggleStampAccordion');
    const stampWrapper = document.getElementById('stampWrapper');
    const stampPreviewIndicator = document.getElementById('stampPreviewIndicator');

    /* =============================================================
       テーマ切り替え（即時スタイル反映）
       ============================================================= */
    function applyTheme(t) {
      document.body.className = '';
      if (t !== 'dull16') document.body.classList.add(`theme-${t}`);
      SafeStorage.set('dull_bbs_theme_choice', t);

      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.t === t);
      });
    }

    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => applyTheme(btn.dataset.t));
    });

    /* =============================================================
       カテゴリタブ管理
       ============================================================= */
    function renderCategoryTabs() {
      categoryTabs.innerHTML = '';
      ROOMS.forEach(r => {
        const btn = document.createElement('button');
        btn.className = `cat-tab ${r.id === currentRoom ? 'active' : ''}`;
        const count = posts.filter(p => p.room === r.id).length;
        btn.innerHTML = `${r.name} <span class="cat-count">${count}</span>`;
        btn.addEventListener('click', () => {
          currentRoom = r.id;
          renderCategoryTabs();
          updateRoomInfo();
          renderFeed();
        });
        categoryTabs.appendChild(btn);
      });
    }

    function updateRoomInfo() {
      const room = ROOMS.find(r => r.id === currentRoom);
      const count = posts.filter(p => p.room === currentRoom).length;
      roomInfoTitle.textContent = room ? room.name : '会議室';
      roomInfoCount.textContent = `${count} 件の投稿`;
    }

    /* =============================================================
       8×8 スタンプエディタ & 16色パレット
       ============================================================= */
    function initStampUI() {
      // 64マス生成
      stampEditorGrid.innerHTML = '';
      for (let i = 0; i < 64; i++) {
        const cell = document.createElement('div');
        cell.className = 'stamp-cell-btn';
        cell.addEventListener('click', () => {
          stampGrid[i] = (stampGrid[i] === selectedStampColor) ? null : selectedStampColor;
          updateStampDisplay();
        });
        stampEditorGrid.appendChild(cell);
      }

      // 16色スウォッチ
      stampColorPalette.innerHTML = '';
      PAL16.forEach((c, idx) => {
        const dot = document.createElement('div');
        dot.className = `stamp-pal-dot ${idx === selectedStampColor ? 'active' : ''}`;
        dot.style.backgroundColor = c;
        dot.addEventListener('click', () => {
          selectedStampColor = idx;
          document.querySelectorAll('.stamp-pal-dot').forEach(d => d.classList.remove('active'));
          dot.classList.add('active');
        });
        stampColorPalette.appendChild(dot);
      });
    }

    function updateStampDisplay() {
      const cells = stampEditorGrid.querySelectorAll('.stamp-cell-btn');
      const hasAny = stampGrid.some(v => v !== null);
      stampGrid.forEach((val, i) => {
        cells[i].style.backgroundColor = val !== null ? PAL16[val] : 'transparent';
      });
      stampPreviewIndicator.textContent = hasAny ? '[添付中] ▴' : '[なし] ▾';
